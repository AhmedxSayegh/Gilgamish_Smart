<!doctype html><html><meta charset="utf-8"><style>body{font:14px Inter,Arial,sans-serif;padding:22px;background:#fcf6ed;color:#482a1d}h2{margin:0 0 12px}p{line-height:1.6}button{padding:12px 22px;background:#713e26;color:white;border:0;border-radius:8px;cursor:pointer}progress{width:100%;accent-color:#b47548;margin:12px 0}small{display:block;margin-top:12px;color:#6e594b}</style><h2>Gilgamish Smart</h2><p>Import all website screens as editable layers.<br>Desktop + Mobile · English + Arabic<br>Creates one new page; keeps existing designs.</p><button id="start">Import editable screens</button><progress id="progress" value="0" max="100"></progress><small id="status">Local design data. No network requests.</small><script>start.onclick=()=>{start.disabled=true;parent.postMessage({pluginMessage:{type:'import'}},'*')};onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;status.textContent=m.status;document.getElementById('status').textContent=m.status+(m.warnings?' · '+m.warnings+' warnings':'');if(m.count)progress.value=m.count/m.total*100;if(m.done){start.textContent='Done';start.disabled=false;start.onclick=()=>parent.postMessage({pluginMessage:{type:'close'}},'*')}};</script></html>
